name: test-dl
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/test-dl.yml']
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yt-dlp
      - run: yt-dlp --no-warnings -F "https://www.youtube.com/watch?v=Cm9ZjAqORmk" | tail -15
      - run: yt-dlp --no-warnings -f "18/best[height<=720]" --download-sections "*00:01:00-00:01:20" -o clip.mp4 "https://www.youtube.com/watch?v=Cm9ZjAqORmk" && ls -la clip.mp4
